[package]
name = "polyanya"
version = "0.16.1"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["pathfinding"]
readme = "README.md"
description = "Polygon Any Angle Pathfinding"
repository = "https://github.com/vleue/polyanya"
homepage = "https://github.com/vleue/polyanya"
documentation = "https://docs.rs/polyanya"
categories = ["game-development"]

[features]
default = ["async", "recast"]
stats = []
verbose = []
async = []
no-default-baking = []
detailed-layers = []
serde = ["glam/serde", "rstar/serde", "dep:serde", "rerecast/serialize"]
recast = []

[dependencies]
spade = { version = "2.15.0" }
tracing = { version = "0.1", optional = true }
hashbrown = { version = "0.17" }
glam = { version = "0.32.1", features = ["approx"] }
smallvec = { version = "1.15", features = ["union", "const_generics"] }
rstar = { version = "0.12" }
serde = { version = "1.0", features = ["derive"], optional = true }
geo = "0.33.1"
log = "0.4"
thiserror = "2"
serde_json = { version = "1.0", optional = true }
rerecast = "0.4.0"

[dev-dependencies]
# criterion = "0.5"
criterion = { package = "codspeed-criterion-compat", version = "3.0" }
tracing-tracy = "0.11"
tracing-subscriber = "0.3"
tracing = "0.1"

serde_json = "1.0"

rerecast = { version = "0.4.0", features = ["serialize"] }


[workspace]
members = ["examples/traced"]

[lib]
bench = false

[[bench]]
name = "path"
harness = false

[[bench]]
name = "no_path"
harness = false

[[bench]]
name = "is_in_mesh"
harness = false

[[bench]]
name = "baking"
harness = false

[[bench]]
name = "triangulation"
harness = false

[[bench]]
name = "merger"
harness = false

[[bench]]
name = "recast"
harness = false

[package.metadata.docs.rs]
features = ["async", "detailed-layers"]
