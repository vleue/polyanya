name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check format
        run: |
          cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run clippy
        run: |
          cargo clippy -- -D warnings

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: |
          cargo test
 
  tests-detailed-layers:
    name: Tests (detailed layers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: |
          cargo test --features detailed-layers

  tests-aurora:
    name: Tests Aurora Map
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: |
          cargo test --release --examples

  soak:
    name: Fuzz soak
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run soak
        run: |
          cargo test --release --test fuzz -- --nocapture
        env:
          POLYANYA_FUZZ_SECONDS: 600
          POLYANYA_FUZZ_SEED: ${{ github.run_id }}

  soak-detailed-layers:
    name: Fuzz soak (detailed layers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run soak
        run: |
          cargo test --release --features detailed-layers --test fuzz -- --nocapture
        env:
          POLYANYA_FUZZ_SECONDS: 600
          POLYANYA_FUZZ_SEED: ${{ github.run_id }}
